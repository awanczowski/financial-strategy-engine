name: CI Engine & Build Check

on:
  push:
    branches: [ main, feature/*, housekeeping/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Run Tests, Linter & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

      - name: Run Linter
        run: npm run lint

      - name: Verify Production Build
        run: npm run build
