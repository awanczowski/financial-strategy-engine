<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Square Frame with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="#000000" stroke="#000000" stroke-width="2"/>
  
  <!-- Outer Vault Circular Ring -->
  <circle cx="32" cy="32" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Inner Vault Door Core -->
  <circle cx="32" cy="32" r="14" fill="#000000"/>
  
  <!-- Combination Lock Dial Spoke Wheel -->
  <circle cx="32" cy="32" r="6" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="3" fill="#000000"/>
  
  <!-- Vault Spoke Handles -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="52" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="20" y2="32" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="52" y2="32" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Diagonal Handles -->
  <line x1="18" y1="18" x2="23" y2="23" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="18" x2="41" y2="23" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="46" x2="23" y2="41" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="46" x2="41" y2="41" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Lock Hinge Bolts -->
  <circle cx="10" cy="20" r="1.5" fill="#FFFFFF"/>
  <circle cx="10" cy="44" r="1.5" fill="#FFFFFF"/>
  <circle cx="54" cy="20" r="1.5" fill="#FFFFFF"/>
  <circle cx="54" cy="44" r="1.5" fill="#FFFFFF"/>
</svg>